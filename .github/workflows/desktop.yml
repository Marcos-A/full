# Tests the native code and builds the Mac app as a universal DMG, because the Mac and the server that this
# is developed on have no Rust. The DMGs have an ad hoc signature: Apple doesn't vouch for them, so a public
# release proves where it came from with a build attestation and an immutable release instead.
name: Desktop build

on:
  push:
    branches: ['desktop-*']
  workflow_dispatch:
    inputs:
      release:
        description: Also keep this build as a test pre-release, which doesn't expire after 14 days
        type: boolean
        default: false
      version:
        description: Or publish it as the public release of this version, such as v0.1.0. Needs main and a public repository
        type: string
        default: ''

permissions:
  contents: read

jobs:
  dmg:
    # Apple Silicon, like the M4. The universal build also holds Intel. This is also the oldest macOS
    # GitHub still hosts and the oldest the app says it runs on, so the page reaching "ready" below
    # shows that navigator.locks works there.
    runs-on: macos-15
    timeout-minutes: 40
    permissions:
      contents: read
      # For the build attestation of a public release.
      id-token: write
      attestations: write
      artifact-metadata: write
    env:
      DMG_DIR: src-tauri/target/universal-apple-darwin/release/bundle/dmg
    steps:
      - uses: actions/checkout@v7

      # In every DMG and artifact name, so that an old download can't pass for a new one.
      - name: Note the commit
        run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      # Before the 30-minute build, everything that would stop the release at the end.
      - name: Check the version to publish
        if: inputs.version != ''
        env:
          VERSION: ${{ inputs.version }}
          IS_PRIVATE: ${{ github.event.repository.private }}
          GH_TOKEN: ${{ github.token }}
        run: |
          expected="v$(node -p "require('./package.json').version")"
          if [ "$VERSION" != "$expected" ]; then
            echo "::error::The version must be $expected, from package.json"
            exit 1
          fi
          if [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "::error::Public releases are built from main"
            exit 1
          fi
          if [ "$IS_PRIVATE" != false ]; then
            echo "::error::Build attestations need a public repository"
            exit 1
          fi
          if gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "::error::$VERSION is already released"
            exit 1
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install Rust from rust-toolchain.toml
        working-directory: src-tauri
        run: |
          rustup toolchain install
          rustc --version

      - run: npm ci

      - name: Run the unit tests
        run: npm test

      - name: Check that the website has no Tauri code
        run: |
          npm run build
          if grep -rlE '__TAURI|@tauri-apps|open_external|ipc\.localhost' dist; then
            echo "::error::Tauri code reached the website's bundle"
            exit 1
          fi

      # Compiling needs the frontend. Finding the markers here shows that the search above works.
      - name: Build the desktop frontend
        run: |
          npm run desktop:frontend
          grep -rqE '__TAURI|open_external' dist-desktop/assets
          cat dist-desktop/build-info.json

      - name: Check and test the native code
        working-directory: src-tauri
        run: |
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked

      - name: Check that devtools are off in the normal build
        working-directory: src-tauri
        run: |
          if cargo tree --locked -e features -i tauri | grep -q 'feature "devtools"'; then
            echo "::error::The normal build has devtools"
            exit 1
          fi

      # The status bar of a release build shows its version.
      - name: Build the DMG
        env:
          RELEASE_TAG: ${{ inputs.version }}
        run: |
          npx tauri build --target universal-apple-darwin -- --locked
          cat dist-desktop/build-info.json
          if [ -n "$RELEASE_TAG" ]; then
            grep -q "\"tag\":\"$RELEASE_TAG\"" dist-desktop/build-info.json
          fi

      - name: Check that the built app starts
        run: |
          version=$(node -p "require('./package.json').version")
          hdiutil attach -nobrowse -mountpoint "$RUNNER_TEMP/mounted" "$DMG_DIR"/*.dmg
          app="$RUNNER_TEMP/mounted/full.app"
          test "$(plutil -extract CFBundleIdentifier raw "$app/Contents/Info.plist")" = com.marcos-a.full
          test "$(plutil -extract CFBundleShortVersionString raw "$app/Contents/Info.plist")" = "$version"
          codesign --verify --deep --strict "$app"
          lipo -archs "$app/Contents/MacOS/full" | grep -q x86_64
          lipo -archs "$app/Contents/MacOS/full" | grep -q arm64
          test "$(plutil -extract LSMinimumSystemVersion raw "$app/Contents/Info.plist")" = 15.0
          test "$(plutil -extract CFBundleDocumentTypes.2.LSHandlerRank raw "$app/Contents/Info.plist")" = Alternate
          for icon in icon document-markdown document-csv document-text; do
            iconutil -c iconset -o "$RUNNER_TEMP/$icon.iconset" "$app/Contents/Resources/$icon.icns"
          done
          # Registering it is what installing it in Applications would do.
          /System/Library/Frameworks/CoreServices.framework/Frameworks/LaunchServices.framework/Support/lsregister -f "$app"
          swift scripts/mac-check-file-types.swift "$app"
          sw_vers
          scripts/mac-app-reaches-ready.sh "$app"
          # Runs the Intel half, as it would on an Intel Mac, under Rosetta.
          if ! arch -x86_64 /usr/bin/true 2>/dev/null; then
            softwareupdate --install-rosetta --agree-to-license
          fi
          scripts/mac-app-reaches-ready.sh "$app" x86_64
          if grep -q developerExtrasEnabled "$app/Contents/MacOS/full"; then
            echo "::error::The normal build contains Web Inspector code"
            exit 1
          fi
          "$app/Contents/MacOS/full" 2> "$RUNNER_TEMP/app.log" &
          pid=$!
          sleep 10
          kill -0 "$pid"
          # A file sent to the running app arrives by a different route from one sent at launch.
          echo x > "$RUNNER_TEMP/warm.md"
          open -a "$app" "$RUNNER_TEMP/warm.md"
          sleep 4
          echo "Copies running: $(pgrep -x full | wc -l)"
          if ! grep -q 'files sent by Finder: 1' "$RUNNER_TEMP/app.log"; then
            echo "::error::A file sent to the running app never arrived"
            warm_failed=1
          fi
          # The same route as Dock Quit and logout, so this reaches applicationShouldTerminate:,
          # asks the page and has to end the app. The runner may refuse to send an Apple event.
          if perl -e 'alarm 30; exec @ARGV' osascript -e 'tell application id "com.marcos-a.full" to quit'; then
            for _ in $(seq 1 20); do
              kill -0 "$pid" 2>/dev/null || break
              sleep 1
            done
            cat "$RUNNER_TEMP/app.log"
            if kill -0 "$pid" 2>/dev/null; then
              echo "::error::The app didn't quit when asked to"
              kill -9 "$pid"
              exit 1
            fi
            if ! grep -q 'close route: AppKit asked, Ask' "$RUNNER_TEMP/app.log"; then
              echo "::error::Quitting didn't go through applicationShouldTerminate:"
              exit 1
            fi
          else
            echo "::warning::The runner refused the Apple event, so the quit route wasn't tested here"
            cat "$RUNNER_TEMP/app.log"
            kill "$pid"
          fi
          wait "$pid" || true
          hdiutil detach "$RUNNER_TEMP/mounted"
          test -z "${warm_failed:-}"

      - name: Add the commit to the DMG's name
        working-directory: ${{ env.DMG_DIR }}
        run: for f in *.dmg; do mv "$f" "${f%.dmg}_$SHORT_SHA.dmg"; done

      # Signs a statement that this exact file came from this workflow, at this commit, on GitHub's
      # runners. Anyone can check it with gh attestation verify, as the README describes.
      - name: Attest where the DMG was built
        if: inputs.version != ''
        uses: actions/attest@v4
        with:
          subject-path: ${{ env.DMG_DIR }}/*.dmg

      - uses: actions/upload-artifact@v7
        with:
          name: full-dmg-${{ env.SHORT_SHA }}
          path: ${{ env.DMG_DIR }}/*.dmg
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      # The same app with Web Inspector on, the only way to read CSP violations on a Mac. Its own
      # name keeps it apart from the normal app in Downloads, Applications and the Dock, and its own
      # identifier keeps macOS from opening files meant for full in it.
      - name: Build the inspector DMG
        run: |
          npx tauri build --target aarch64-apple-darwin --features inspector --config '{"productName":"full inspector","identifier":"com.marcos-a.full.inspector"}' -- --locked
          hdiutil attach -nobrowse -mountpoint "$RUNNER_TEMP/inspector" src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
          grep -q developerExtrasEnabled "$RUNNER_TEMP/inspector/full inspector.app/Contents/MacOS/full"
          test "$(plutil -extract CFBundleIdentifier raw "$RUNNER_TEMP/inspector/full inspector.app/Contents/Info.plist")" = com.marcos-a.full.inspector
          hdiutil detach "$RUNNER_TEMP/inspector"
          cd src-tauri/target/aarch64-apple-darwin/release/bundle/dmg
          for f in *.dmg; do mv "$f" "${f%.dmg}_$SHORT_SHA.dmg"; done

      - uses: actions/upload-artifact@v7
        with:
          name: full-inspector-dmg-${{ env.SHORT_SHA }}
          path: src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  # Run from the Actions page with "release" ticked or a version given. CI's own files are deleted after
  # 14 days, and a release keeps the DMG.
  release:
    needs: dmg
    if: github.event_name == 'workflow_dispatch' && (inputs.release || inputs.version != '')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      attestations: read
    steps:
      - name: Note the commit
        run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - uses: actions/download-artifact@v7
        with:
          name: full-dmg-${{ env.SHORT_SHA }}
          path: dmg

      # GitHub shows each file's SHA-256 next to it, so no checksum file is needed.
      - name: Keep the DMG as a test pre-release
        if: inputs.version == ''
        working-directory: dmg
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          subject=$(gh api "repos/$GH_REPO/commits/$GITHUB_SHA" --jq '.commit.message | split("\n")[0]')
          notes="Universal Mac app with an ad hoc signature, built from \`$GITHUB_REF_NAME\` at \`$SHORT_SHA\`: $subject

          A test build, with no build attestation. Install it as the README's Mac app section describes."
          if gh release view "mac-$SHORT_SHA" > /dev/null 2>&1; then
            gh release upload "mac-$SHORT_SHA" *.dmg --clobber
          else
            gh release create "mac-$SHORT_SHA" *.dmg --target "$GITHUB_SHA" --prerelease \
              --title "Mac app, build $SHORT_SHA" --notes "$notes"
          fi

      # Published as a draft first, so that the DMG is attached before the release turns immutable.
      # Skipped when this job is re-run and the release is already out, so that the checks can be
      # run again on their own.
      - name: Publish the public release
        if: inputs.version != ''
        working-directory: dmg
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ inputs.version }}
        run: |
          if [ "$(gh release view "$VERSION" --json isDraft --jq .isDraft 2>/dev/null)" = false ]; then
            echo "$VERSION is already published"
            exit 0
          fi
          notes="Universal Mac app for macOS 15 or later, on Apple Silicon or Intel, built from \`main\` at \`$SHORT_SHA\`.

          Apple hasn't checked it, so macOS blocks it until you allow it. Before you do, check that your download is this release's file, as the [README](https://github.com/$GH_REPO#mac-app) describes."
          gh release create "$VERSION" *.dmg --target "$GITHUB_SHA" --draft \
            --title "full ${VERSION#v} for Mac" --notes "$notes"
          gh release edit "$VERSION" --draft=false --latest

      # The same checks the README asks users to run. They fail if immutable releases are off in the
      # repository's settings. GitHub writes the release's attestation a few seconds after publishing,
      # so the first check waits for it.
      - name: Check the release as a user would
        if: inputs.version != ''
        working-directory: dmg
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ inputs.version }}
        run: |
          for _ in $(seq 1 12); do
            gh release verify "$VERSION" && break
            sleep 10
          done
          gh release verify "$VERSION"
          gh release verify-asset "$VERSION" *.dmg
          gh attestation verify *.dmg --repo "$GH_REPO" \
            --signer-workflow "$GH_REPO/.github/workflows/desktop.yml" --source-ref refs/heads/main
