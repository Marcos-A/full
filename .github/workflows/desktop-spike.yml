# Builds the throwaway Tauri shell for the M0 spike (see TODO.md) as a DMG.
# The shell is generated on every run, so no src-tauri code enters the repo.
# Not for distribution: test identifier, devtools on, ad hoc signature only.
name: Desktop spike

on:
  push:
    branches: [desktop-spike]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dmg:
    runs-on: macos-15 # Apple Silicon, like the M4
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc --version

      - name: Build the website
        run: |
          npm ci
          npm run build

      - name: Generate the Tauri shell
        run: |
          npm install --no-save @tauri-apps/cli@^2
          npx tauri init --ci -A full -W full -D ../dist -P http://localhost:5173 --before-dev-command "" --before-build-command ""
          cargo add tauri --features devtools --manifest-path src-tauri/Cargo.toml
          node <<'EOF'
          const fs = require('fs');
          const path = 'src-tauri/tauri.conf.json';
          const config = JSON.parse(fs.readFileSync(path));
          config.identifier = 'com.marcos-a.full.spike';
          config.app.windows[0].devtools = true;
          config.app.security = {
            csp: "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' https: data: blob:; font-src 'self'; connect-src 'self' ipc: http://ipc.localhost; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'none'",
            dangerousDisableAssetCspModification: ['style-src'],
          };
          config.bundle.macOS = { ...config.bundle.macOS, signingIdentity: '-' };
          fs.writeFileSync(path, JSON.stringify(config, null, 2));
          EOF

      # Logs native events to the terminal and ~/full-spike-events.log, so the
      # close, quit and drop questions can be answered. Set FULL_SPIKE_HOLD=1 to
      # also try holding back each close and exit.
      - name: Add the native event log
        run: |
          cat > src-tauri/src/lib.rs <<'EOF'
          use std::{env, fs::OpenOptions, io::Write, time::{SystemTime, UNIX_EPOCH}};
          use tauri::{DragDropEvent, RunEvent, WindowEvent};

          fn log(message: String) {
              let ms = SystemTime::now().duration_since(UNIX_EPOCH).unwrap().as_millis();
              let line = format!("{ms} {message}");
              eprintln!("{line}");
              if let Ok(home) = env::var("HOME") {
                  let path = format!("{home}/full-spike-events.log");
                  if let Ok(mut file) = OpenOptions::new().create(true).append(true).open(path) {
                      let _ = writeln!(file, "{line}");
                  }
              }
          }

          fn hold() -> bool {
              env::var_os("FULL_SPIKE_HOLD").is_some()
          }

          #[cfg_attr(mobile, tauri::mobile_entry_point)]
          pub fn run() {
              tauri::Builder::default()
                  .on_window_event(|_window, event| match event {
                      WindowEvent::CloseRequested { api, .. } => {
                          log(format!("CloseRequested hold={}", hold()));
                          if hold() {
                              api.prevent_close();
                          }
                      }
                      WindowEvent::Destroyed => log("Destroyed".into()),
                      WindowEvent::DragDrop(DragDropEvent::Drop { paths, .. }) => {
                          log(format!("Drop {paths:?}"));
                      }
                      _ => {}
                  })
                  .build(tauri::generate_context!())
                  .expect("error while building the app")
                  .run(|_app, event| match event {
                      RunEvent::ExitRequested { api, code, .. } => {
                          log(format!("ExitRequested code={code:?} hold={}", hold()));
                          if hold() {
                              api.prevent_exit();
                          }
                      }
                      RunEvent::Exit => log("Exit".into()),
                      _ => {}
                  });
          }
          EOF

      - name: Build the DMG
        run: npx tauri build --bundles dmg

      - uses: actions/upload-artifact@v7
        with:
          name: full-spike-dmg
          path: src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
