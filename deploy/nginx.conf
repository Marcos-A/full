server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml;

    # add_header does not inherit into a block that sets its own, so each block includes these.
    location /assets/ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Written at deploy time, so the commit and release can change without a rebuild.
    location = /build-info.json {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        default_type application/json;
        alias /build-meta/build-info.json;
    }

    location = /favicon.svg {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    location / {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }
}
